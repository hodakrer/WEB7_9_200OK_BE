spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_JDBC_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      auto-commit: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  #  elasticsearch:
  #    uris: http://localhost:9200

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  jpa:
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
    hibernate:
      ddl-auto: validate
    show-sql: true

  batch:
    job:
      enabled: false # 앱 시작 시 배치 자동 실행 금지
      jdbc:
        initialize-schema: always # 배치 메타테이블 자동 생성. 실제 운영 시 never로 바꾸자.

  kakao:
    client:
      id: ${REST_API_KAKAO}
      secret: ${CLIENT_SECRET_KAKAO}
    redirect:
      uri: ${REDIRECT_URI_KAKAO}

  naver:
    client:
      id: ${CLIENT_ID_NAVER}
      secret: ${CLIENT_SECRET_NAVER}
    redirect:
      uri: ${REDIRECT_URI_NAVER}

  google:
    client:
      id: ${CLIENT_ID_GOOGLE}
      secret: ${CLIENT_SECRET_GOOGLE}
    redirect:
      uri: ${REDIRECT_URI_GOOGLE}

  toss:
    secretkey: ${SECRETKEY_TOSS}
    base-url: ${BASE_URL_TOSS}

logging:
  level:
    org.springframework.boot.actuate.endpoint.web: DEBUG
    org.springframework.web.servlet: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE
    org.springframework.transaction.interceptor: TRACE
    com.backend: DEBUG
  discord:
    webhook-url: ${DISCORD_WEBHOOK_URL}
  config: classpath:logback.xml

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

custom:
  jwt:
    expireSecondsAccessToken: 31536000 # 테스트용 -> 실제론 1시간
    expireSecondsRefreshToken: 31536000 # 테스트용 -> 실제론 7일
    secretPattern: ${SECRET_PATTERN}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

app:
  seed:
    enabled: false   # 기본은 false
    reset: false     # true면 전체 삭제 후 재삽입
    marker-email: seed_admin@windfall.local

aws:
  s3:
    accessKey: ${S3_ACCESS_KEY}
    secretKey: ${S3_SECRET_KEY}
    bucketName: ${BUCKET_NAME}
    baseUrl: ${S3_BASE_URL}

management:
  endpoints:
    web:
      exposure:
        include: "*"
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  health:
    redis:
      enabled: false # 헬스체크 최소화
  metrics:
    export:
      prometheus:
        enabled: true

resilience4j:
  retry:
    configs:
      customRetry:
        maxAttempts: 3
        waitDuration: 2s
        enableExponentialBackoff: true
        exponential-backoff-multiplier: 2.0